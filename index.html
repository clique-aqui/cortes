
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortes AI | Lives ao Vivo</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#090b12;
    color:#f5f5f5;
    font-family:Arial,sans-serif;
}
header{
    padding:24px 5%;
    background:#111521;
    border-bottom:1px solid #252b3a;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;
}
.logo{font-size:25px;font-weight:bold}
.logo span{color:#9147ff}
.status{color:#42e68b;font-size:13px}
main{padding:25px 5%}
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:28px;
}
.stat{
    background:#151a27;
    border:1px solid #252b3a;
    border-radius:13px;
    padding:20px;
}
.stat small{color:#9ba4b8}
.stat strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}
h2{margin:28px 0 18px;font-size:21px}
.lives{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}
.live{
    background:#151a27;
    border:1px solid #292f40;
    border-radius:14px;
    overflow:hidden;
}
.player{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}
.player iframe{
    width:100%;
    height:100%;
    border:0;
}
.info{padding:15px}
.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
.live-badge{
    background:#e52b45;
    color:white;
    padding:5px 9px;
    border-radius:5px;
    font-size:11px;
    font-weight:bold;
}
.channel{font-size:18px;font-weight:bold}
.title{
    color:#aab2c4;
    font-size:13px;
    margin:10px 0;
    line-height:1.5;
}
.details{
    display:flex;
    justify-content:space-between;
    color:#aab2c4;
    font-size:13px;
    gap:10px;
}
.viewers{color:#42e68b;font-weight:bold}
.watch{
    display:block;
    text-align:center;
    background:#9147ff;
    color:white;
    text-decoration:none;
    padding:11px;
    margin-top:15px;
    border-radius:8px;
    font-weight:bold;
}
.watch:hover{background:#762ce5}
.empty{
    color:#9ba4b8;
    background:#151a27;
    padding:30px;
    border-radius:12px;
    text-align:center;
}
footer{
    padding:25px;
    text-align:center;
    color:#747d91;
    font-size:12px;
}
@media(max-width:500px){
    main{padding:18px 4%}
    .lives{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <div class="logo">CORTES <span>AI</span></div>
    <div class="status">● SISTEMA ONLINE</div>
</header>

<main>

    <div class="stats">
        <div class="stat">
            <small>Lives encontradas</small>
            <strong id="totalLives">0</strong>
        </div>

        <div class="stat">
            <small>Espectadores ao vivo</small>
            <strong id="totalViewers">0</strong>
        </div>

        <div class="stat">
            <small>Última atualização</small>
            <strong id="lastUpdate" style="font-size:18px">--:--:--</strong>
        </div>
    </div>

    <h2>🔴 Transmissões ao vivo</h2>

    <div id="lives" class="lives">
        <div class="empty">Carregando transmissões...</div>
    </div>

</main>

<footer>
    CORTES AI · Painel de monitoramento de transmissões
</footer>

<script>
const PARENT = "clique-aqui.github.io";
const REFRESH_TIME = 60000;

const livesContainer = document.getElementById("lives");

let livesAtuais = new Map();

function numero(valor){
    return Number(valor || 0).toLocaleString("pt-BR");
}

function criarLive(live){

    const canal = live.canal || live.user_name || "";
    const canalId = String(canal).toLowerCase();

    if(!canalId) return null;

    const card = document.createElement("article");
    card.className = "live";
    card.dataset.canal = canalId;

    const player = document.createElement("div");
    player.className = "player";

    const iframe = document.createElement("iframe");

    iframe.src =
        "https://player.twitch.tv/?channel=" +
        encodeURIComponent(canalId) +
        "&parent=" + PARENT +
        "&muted=true&autoplay=true";

    iframe.allow = "autoplay; fullscreen";
    iframe.allowFullscreen = true;
    iframe.loading = "lazy";
    iframe.title = "Transmissão de " + canal;

    player.appendChild(iframe);

    const info = document.createElement("div");
    info.className = "info";

    const top = document.createElement("div");
    top.className = "top";

    const nome = document.createElement("div");
    nome.className = "channel";
    nome.textContent = canal;

    const badge = document.createElement("span");
    badge.className = "live-badge";
    badge.textContent = "AO VIVO";

    top.appendChild(nome);
    top.appendChild(badge);

    const titulo = document.createElement("div");
    titulo.className = "title";
    titulo.textContent = live.titulo || "Transmissão ao vivo";

    const detalhes = document.createElement("div");
    detalhes.className = "details";

    const categoria = document.createElement("span");
    categoria.textContent = live.categoria || "Sem categoria";

    const espectadores = document.createElement("span");
    espectadores.className = "viewers";
    espectadores.textContent =
        "● " + numero(live.espectadores) + " espectadores";

    detalhes.appendChild(categoria);
    detalhes.appendChild(espectadores);

    const link = document.createElement("a");
    link.className = "watch";
    link.href = "https://www.twitch.tv/" + encodeURIComponent(canalId);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Abrir na Twitch";

    info.appendChild(top);
    info.appendChild(titulo);
    info.appendChild(detalhes);
    info.appendChild(link);

    card.appendChild(player);
    card.appendChild(info);

    return {
        card,
        espectadores,
        titulo,
        categoria
    };
}

async function buscarArquivo(nome){

    const resposta = await fetch(
        "dados/" + nome + "?t=" + Date.now(),
        {cache:"no-store"}
    );

    if(!resposta.ok) return [];

    return await resposta.json();
}

async function atualizar(){

    try{

        const dados = await buscarArquivo("transmissoes.json");

        const lista = Array.isArray(dados) ? dados : [];

        const novasLives = new Map();

        let totalEspectadores = 0;

        lista.forEach(live => {

            const canal = live.canal || live.user_name || "";
            const id = String(canal).toLowerCase();

            if(!id) return;

            const espectadores = Number(live.espectadores || 0);

            totalEspectadores += espectadores;

            let item = livesAtuais.get(id);

            if(item){

                // Atualiza os dados sem reiniciar o player.
                item.espectadores.textContent =
                    "● " + numero(espectadores) + " espectadores";

                item.titulo.textContent =
                    live.titulo || "Transmissão ao vivo";

                item.categoria.textContent =
                    live.categoria || "Sem categoria";

            }else{

                item = criarLive(live);

            }

            if(item){
                novasLives.set(id, item);
            }

        });

        // Remove canais que não estão mais ao vivo.
        livesAtuais.forEach((item, id) => {
            if(!novasLives.has(id)){
                item.card.remove();
            }
        });

        // Adiciona novas transmissões.
        novasLives.forEach((item, id) => {
            if(!item.card.isConnected){
                livesContainer.appendChild(item.card);
            }
        });

        livesAtuais = novasLives;

        // Ordena os cards pelos espectadores.
        const ordenadas = [...livesAtuais.entries()].sort(
            (a,b) => {
                const av = Number(
                    a[1].espectadores.textContent.replace(/\D/g,"")
                );
                const bv = Number(
                    b[1].espectadores.textContent.replace(/\D/g,"")
                );
                return bv-av;
            }
        );

        ordenadas.forEach(([id,item]) => {
            livesContainer.appendChild(item.card);
        });

        document.getElementById("totalLives").textContent =
            numero(lista.length);

        document.getElementById("totalViewers").textContent =
            numero(totalEspectadores);

        document.getElementById("lastUpdate").textContent =
            new Date().toLocaleTimeString("pt-BR");

        if(lista.length === 0){
            livesContainer.innerHTML =
                '<div class="empty">Nenhuma transmissão encontrada no momento.</div>';
        }

    }catch(erro){

        console.error("Erro ao atualizar painel:", erro);

        if(livesAtuais.size === 0){
            livesContainer.innerHTML =
                '<div class="empty">Não foi possível carregar as transmissões.</div>';
        }

    }
}

atualizar();
setInterval(atualizar, REFRESH_TIME);

</script>

</body>
</html>
