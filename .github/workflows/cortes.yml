
name: Cortes AI V2

on:
  workflow_dispatch:
    inputs:
      teste_privado:
        description: "Enviar 1 clipe como PRIVADO para testar"
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: cortes-ai
  cancel-in-progress: false

jobs:
  descoberta:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install -r requirements.txt

      - name: Descobrir transmissões
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python main.py buscar

      - name: Buscar clipes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python main.py clipes

      - name: Selecionar melhores clipes
        run: python main.py melhores

      - name: Analisar clipes com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py ia

      - name: Preparar e publicar clipes aprovados
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
          PRIVATE_TEST: ${{ inputs.teste_privado }}
          MAX_POSTS_PER_RUN: "1"
          MIN_CLIP_VIEWS: "100"
        run: python publisher.py

      - name: Salvar resultados
        run: |
          git config user.name "cortes-ai"
          git config user.email "cortes-ai@users.noreply.github.com"

          git add dados/ posted.json historico.json

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza transmissões e análises de IA"
            git push
          fi
