
name: Cortes AI

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: cortes-ai
  cancel-in-progress: false

jobs:
  descoberta:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: |
          pip install -r requirements.txt

      - name: Descobrir transmissões
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          python main.py buscar

      - name: Salvar resultados
        run: |
          git config user.name "cortes-ai"
          git config user.email "cortes-ai@users.noreply.github.com"

          git add dados/

          if ! git diff --cached --quiet; then
            git commit -m "Atualiza descoberta de transmissões"
            git push
          fi
